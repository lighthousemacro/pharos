<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pharos — Lighthouse Macro</title>
<link rel="canonical" href="https://pharos.lighthousemacro.com">
<meta http-equiv="refresh" content="0; url=https://pharos.lighthousemacro.com">
<meta name="robots" content="noindex">
<script>window.location.replace("https://pharos.lighthousemacro.com");</script>
<style>
  :root{--ocean:#2389BB;--dusk:#FF6723;--deep:#123456;--glacier:#F4F7F9;--doldrums:#898989;}
  html,body{margin:0;height:100%;}
  body{font-family:"Inter","Helvetica Neue",Arial,sans-serif;background:var(--glacier);
       color:var(--deep);display:flex;align-items:center;justify-content:center;text-align:center;}
  .bar{position:fixed;top:0;left:0;right:0;height:5px;
       background:linear-gradient(90deg,var(--ocean) 0 66%,var(--dusk) 66% 100%);}
  h1{font-family:"Montserrat","Inter",sans-serif;font-size:22px;margin:0 0 10px;}
  p{margin:0 0 18px;color:var(--doldrums);font-size:15px;}
  a{display:inline-block;background:var(--ocean);color:#fff;text-decoration:none;
    font-weight:600;padding:11px 22px;border-radius:3px;}
  .src{margin-top:26px;font-size:12px;color:var(--doldrums);}
  .src a{background:none;color:var(--ocean);padding:0;font-weight:400;}
</style>
</head>
<body>
<div class="bar"></div>
<div>
  <h1>Pharos</h1>
  <p>The terminal lives at pharos.lighthousemacro.com</p>
  <a href="https://pharos.lighthousemacro.com">Open Pharos</a>
  <div class="src">Source for the Agora Agents prototype:
    <a href="https://github.com/lighthousemacro/pharos">github.com/lighthousemacro/pharos</a></div>
</div>
</body>
</html>
